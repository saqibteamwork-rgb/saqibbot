
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <radialGradient id="redGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
    <radialGradient id="greenGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
    <radialGradient id="yellowGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
    <radialGradient id="blueGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Top Title Banner -->
  <g transform="translate(400, 65)">
    <text text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" letter-spacing="2">
      🎲 LUDO STAR CLASSIC
    </text>
    <text y="32" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="1">
      PLAY ONLINE DIRECTLY IN WHATSAPP
    </text>
  </g>

  <!-- Ludo Board (600x600 centered at 400, 460) -->
  <g transform="translate(100, 140)" filter="url(#shadow)">
    <!-- Board Base Outer -->
    <rect width="600" height="600" rx="20" fill="#ffffff" stroke="#312e81" stroke-width="8" />

    <!-- Corner Bases (240x240 each) -->
    <!-- Green Top-Left -->
    <rect x="0" y="0" width="240" height="240" rx="16" fill="#10b981" />
    <rect x="35" y="35" width="170" height="170" rx="14" fill="#ffffff" />
    <circle cx="80" cy="80" r="22" fill="#e2e8f0" />
    <circle cx="160" cy="80" r="22" fill="#e2e8f0" />
    <circle cx="80" cy="160" r="22" fill="#e2e8f0" />
    <circle cx="160" cy="160" r="22" fill="#e2e8f0" />
    <circle cx="80" cy="80" r="18" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="160" cy="80" r="18" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="80" cy="160" r="18" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="160" cy="160" r="18" fill="url(#greenGrad)" stroke="#ffffff" stroke-width="2" />

    <!-- Yellow Top-Right -->
    <rect x="360" y="0" width="240" height="240" rx="16" fill="#f59e0b" />
    <rect x="395" y="35" width="170" height="170" rx="14" fill="#ffffff" />
    <circle cx="440" cy="80" r="22" fill="#e2e8f0" />
    <circle cx="520" cy="80" r="22" fill="#e2e8f0" />
    <circle cx="440" cy="160" r="22" fill="#e2e8f0" />
    <circle cx="520" cy="160" r="22" fill="#e2e8f0" />
    <circle cx="440" cy="80" r="18" fill="url(#yellowGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="520" cy="80" r="18" fill="url(#yellowGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="440" cy="160" r="18" fill="url(#yellowGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="520" cy="160" r="18" fill="url(#yellowGrad)" stroke="#ffffff" stroke-width="2" />

    <!-- Red Bottom-Left -->
    <rect x="0" y="360" width="240" height="240" rx="16" fill="#ef4444" />
    <rect x="35" y="395" width="170" height="170" rx="14" fill="#ffffff" />
    <circle cx="80" cy="440" r="22" fill="#e2e8f0" />
    <circle cx="160" cy="440" r="22" fill="#e2e8f0" />
    <circle cx="80" cy="520" r="22" fill="#e2e8f0" />
    <circle cx="160" cy="520" r="22" fill="#e2e8f0" />
    <circle cx="80" cy="440" r="18" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="160" cy="440" r="18" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="80" cy="520" r="18" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="160" cy="520" r="18" fill="url(#redGrad)" stroke="#ffffff" stroke-width="2" />

    <!-- Blue Bottom-Right -->
    <rect x="360" y="360" width="240" height="240" rx="16" fill="#3b82f6" />
    <rect x="395" y="395" width="170" height="170" rx="14" fill="#ffffff" />
    <circle cx="440" cy="440" r="22" fill="#e2e8f0" />
    <circle cx="520" cy="440" r="22" fill="#e2e8f0" />
    <circle cx="440" cy="520" r="22" fill="#e2e8f0" />
    <circle cx="520" cy="520" r="22" fill="#e2e8f0" />
    <circle cx="440" cy="440" r="18" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="520" cy="440" r="18" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="440" cy="520" r="18" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />
    <circle cx="520" cy="520" r="18" fill="url(#blueGrad)" stroke="#ffffff" stroke-width="2" />

    <!-- Center Triangles (240..360, 240..360) -->
    <polygon points="240,240 360,240 300,300" fill="#10b981" />
    <polygon points="360,240 360,360 300,300" fill="#f59e0b" />
    <polygon points="240,360 360,360 300,300" fill="#3b82f6" />
    <polygon points="240,240 240,360 300,300" fill="#ef4444" />
    <circle cx="300" cy="300" r="24" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
    <text x="300" y="308" text-anchor="middle" font-size="20">👑</text>

    <!-- Colored Home Runway tracks -->
    <!-- Red Home runway (left) -->
    <rect x="40" y="280" width="200" height="40" fill="#ef4444" />
    <!-- Green Home runway (top) -->
    <rect x="280" y="40" width="40" height="200" fill="#10b981" />
    <!-- Yellow Home runway (right) -->
    <rect x="360" y="280" width="200" height="40" fill="#f59e0b" />
    <!-- Blue Home runway (bottom) -->
    <rect x="280" y="360" width="40" height="200" fill="#3b82f6" />

    <!-- Start squares -->
    <rect x="40" y="320" width="40" height="40" fill="#ef4444" />
    <rect x="240" y="40" width="40" height="40" fill="#10b981" />
    <rect x="520" y="240" width="40" height="40" fill="#f59e0b" />
    <rect x="320" y="520" width="40" height="40" fill="#3b82f6" />

    <!-- Safe Stars -->
    <text x="60" y="348" text-anchor="middle" font-size="26" fill="#ffffff">★</text>
    <text x="260" y="68" text-anchor="middle" font-size="26" fill="#ffffff">★</text>
    <text x="540" y="268" text-anchor="middle" font-size="26" fill="#ffffff">★</text>
    <text x="340" y="548" text-anchor="middle" font-size="26" fill="#ffffff">★</text>

    <text x="100" y="268" text-anchor="middle" font-size="26" fill="#64748b">★</text>
    <text x="340" y="108" text-anchor="middle" font-size="26" fill="#64748b">★</text>
    <text x="500" y="348" text-anchor="middle" font-size="26" fill="#64748b">★</text>
    <text x="260" y="508" text-anchor="middle" font-size="26" fill="#64748b">★</text>

    <!-- 3D Rolling Dice floating on right bottom -->
    <g transform="translate(490, 480)" filter="url(#shadow)">
      <rect width="90" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
      <circle cx="25" cy="25" r="7" fill="#dc2626" />
      <circle cx="65" cy="25" r="7" fill="#dc2626" />
      <circle cx="25" cy="45" r="7" fill="#dc2626" />
      <circle cx="65" cy="45" r="7" fill="#dc2626" />
      <circle cx="25" cy="65" r="7" fill="#dc2626" />
      <circle cx="65" cy="65" r="7" fill="#dc2626" />
    </g>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(400, 765)">
    <rect x="-180" y="-20" width="360" height="34" rx="17" fill="#1e1e38" stroke="#4f46e5" stroke-width="2"/>
    <text y="4" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#fbbf24">
      ⚡ 1P VS BOT • 2 PLAYERS • 4 PLAYERS
    </text>
  </g>
</svg>
